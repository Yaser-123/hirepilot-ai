<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Obsidian Navy Rounded Squircle Base -->
  <rect width="128" height="128" rx="28" fill="#080E24"/>
  
  <!-- Subtle inner gradient glow -->
  <rect x="2" y="2" width="124" height="124" rx="26" stroke="url(#border-glow)" stroke-width="2" stroke-opacity="0.3"/>

  <!-- HirePilot Flight Vector & Navigation Monogram -->
  <g id="hirepilot-symbol">
    <!-- Left Navigation Pillar -->
    <path 
      d="M36 32 C36 29.79 37.79 28 40 28 H47 C49.21 28 51 29.79 51 32 V96 C51 98.21 49.21 100 47 100 H40 C37.79 100 36 98.21 36 96 V32 Z" 
      fill="#FFFFFF"
    />
    
    <!-- Right Navigation Pillar -->
    <path 
      d="M77 32 C77 29.79 78.79 28 81 28 H88 C90.21 28 92 29.79 92 32 V96 C92 98.21 90.21 100 88 100 H81 C78.79 100 77 98.21 77 96 V32 Z" 
      fill="#FFFFFF"
    />
    
    <!-- Central Dynamic Jet / Navigation Arrowhead bridging the pillars -->
    <path 
      d="M48 64 L64 42 L80 64 L64 57 Z" 
      fill="url(#cobalt-accent)"
    />
    
    <!-- Stabilizing Crossbar Vector -->
    <path 
      d="M49 63 H79 C80.66 63 82 64.34 82 66 C82 67.66 80.66 69 79 69 H49 C47.34 69 46 67.66 46 66 C46 64.34 47.34 63 49 63 Z" 
      fill="#2563EB"
    />
    
    <!-- Speed Thrust Particle -->
    <circle cx="64" cy="79" r="4" fill="#38BDF8"/>
  </g>

  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="cobalt-accent" x1="48" y1="42" x2="80" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="border-glow" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
</svg>